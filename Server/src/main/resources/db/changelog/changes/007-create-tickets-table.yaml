databaseChangeLog:
  - changeSet:
      id: 007-create-ticket-table
      author: event-ticketing
      comment: Create tickets table for EventTicketing.model.Ticket entity
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: tickets
      changes:
        - createTable:
            tableName: tickets
            remarks: Stores issued tickets linked to bookings, events, venues and users
            columns:
              - column:
                  name: uuid
                  type: UUID
                  autoIncrement: false
                  remarks: PK - generated via @UuidGenerator
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tickets
                    nullable: false

              - column:
                  name: ticket_code
                  type: VARCHAR(64)
                  remarks: Unique human-readable code
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_tickets_ticket_code
                    nullable: true

              - column:
                  name: creation_date
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Field createdAt (Instant) - set in @PrePersist
                  constraints:
                    nullable: true

              - column:
                  name: booking_id
                  type: UUID
                  remarks: FK to booking.id
                  constraints:
                    nullable: false

              - column:
                  name: seat
                  type: UUID
                  remarks: FK to seat_categories.id
                  constraints:
                    nullable: false

              - column:
                  name: evnt
                  type: UUID
                  remarks: FK to events.id
                  constraints:
                    nullable: false

              - column:
                  name: venue
                  type: UUID
                  remarks: FK to venues.id
                  constraints:
                    nullable: false

              - column:
                  name: user_owner_uuid
                  type: UUID
                  remarks: FK to users.id - ticket owner
                  constraints:
                    nullable: false

              - column:
                  name: total_price
                  type: DECIMAL(19, 2)
                  remarks: Field totalPrice (BigDecimal)
                  constraints:
                    nullable: true

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ISSUED
                  remarks: TicketStatus enum stored as STRING
                  constraints:
                    nullable: false

              - column:
                  name: checked_in_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: Set on check-in, null otherwise
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: booking_id
            constraintName: fk_tickets_booking_id
            referencedTableName: booking
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: seat
            constraintName: fk_tickets_seat
            referencedTableName: seat_categories
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: evnt
            constraintName: fk_tickets_evnt
            referencedTableName: events
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: venue
            constraintName: fk_tickets_venue
            referencedTableName: venues
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableName: tickets
            baseColumnNames: user_owner_uuid
            constraintName: fk_tickets_user_owner
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE

        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE tickets ADD CONSTRAINT chk_tickets_status
              CHECK (status IN ('ISSUED','VALID','USED','CANCELLED','REFUNDED','EXPIRED','TRANSFERRED','CHECKED_IN'));

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_booking_id
            columns:
              - column:
                  name: booking_id

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_evnt
            columns:
              - column:
                  name: evnt

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_user_owner
            columns:
              - column:
                  name: user_owner_uuid

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_status
            columns:
              - column:
                  name: status

        - createIndex:
            tableName: tickets
            indexName: idx_tickets_ticket_code
            columns:
              - column:
                  name: ticket_code

      rollback:
        - dropTable:
            tableName: tickets
