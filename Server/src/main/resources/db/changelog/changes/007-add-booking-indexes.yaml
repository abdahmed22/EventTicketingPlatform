databaseChangeLog:
  - changeSet:
      id: 007-add-booking-indexes
      author: person3-booking
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_booking_user_id
      changes:

        - createIndex:
            indexName: idx_booking_user_id
            tableName: booking
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_booking_event_id
            tableName: booking
            columns:
              - column:
                  name: event_id

        - createIndex:
            indexName: idx_booking_seat_category_id
            tableName: booking
            columns:
              - column:
                  name: seat_category_id

        # Supports the expiry scheduler's
        # findByStatusAndExpiresAtBefore(PENDING, now) query, which runs
        # every 60s.
        - createIndex:
            indexName: idx_booking_status_expires_at
            tableName: booking
            columns:
              - column:
                  name: status
              - column:
                  name: expires_at