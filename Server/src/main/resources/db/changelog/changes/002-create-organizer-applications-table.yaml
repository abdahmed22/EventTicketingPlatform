databaseChangeLog:
  - changeSet:
      id: 002-create-organizer-applications-table
      author: Abd El Rahman Ahmed Mahmoud
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: organizer_applications
      changes:
        - createTable:
            tableName: organizer_applications
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uc_organizer_applications_email
              - column:
                  name: phone
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: organization_name
                  type: VARCHAR(150)
              - column:
                  name: reason
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: submitted_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: reviewed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: reviewed_by
                  type: UUID
              - column:
                  name: rejection_reason
                  type: VARCHAR(500)
        - addForeignKeyConstraint:
            baseTableName: organizer_applications
            baseColumnNames: reviewed_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_organizer_applications_reviewed_by
            onDelete: SET NULL