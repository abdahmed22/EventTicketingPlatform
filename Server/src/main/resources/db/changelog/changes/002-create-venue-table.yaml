databaseChangeLog:
  - changeSet:
      id: create-venue-status-enum
      author: mazen

      changes:
        - sql:
            sql: |
              CREATE TYPE venue_status AS ENUM (
                'PENDING',
                'APPROVED',
                'REJECTED'
              );

  - changeSet:
      id: create-venues-table
      author: mazen

      changes:
        - createTable:
            tableName: venues
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: capacity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: requested_by
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: venue_status
                  constraints:
                    nullable: false

              - column:
                  name: reviewed_at
                  type: TIMESTAMP

              - column:
                  name: reviewed_by
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: venues
            baseColumnNames: requested_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_venues_requested_by

        - addForeignKeyConstraint:
            baseTableName: venues
            baseColumnNames: reviewed_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_venues_reviewed_by