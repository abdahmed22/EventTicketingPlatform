databaseChangeLog:

  - changeSet:
      id: create-event-enums
      author: mazen
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: events
      changes:
        - sql:
            sql: |
              CREATE TYPE event_category AS ENUM (
                'MUSIC',
                'SPORTS',
                'CONFERENCE',
                'THEATRE',
                'OTHER'
              );

              CREATE TYPE event_status AS ENUM (
                'DRAFT',
                'PUBLISHED',
                'CANCELLED'
              );

  - changeSet:
      id: create-events-table
      author: mazen
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: events
      changes:
        - createTable:
            tableName: events

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: category
                  type: event_category
                  constraints:
                    nullable: false

              - column:
                  name: event_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: event_time
                  type: TIME
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: event_status
                  constraints:
                    nullable: false

              - column:
                  name: venue_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: organizer_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: venue_id
            referencedTableName: venues
            referencedColumnNames: id
            constraintName: fk_events_venue

        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: organizer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_events_organizer