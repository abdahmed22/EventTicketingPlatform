databaseChangeLog:
  - changeSet:
      id: 006-create-booking-table
      author: Yousef
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: booking
      changes:

        - createTable:
            tableName: booking
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: seat_category_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: total_price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: confirmed_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: cancelled_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableName: booking
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_booking_user

        - addForeignKeyConstraint:
            baseTableName: booking
            baseColumnNames: event_id
            referencedTableName: events
            referencedColumnNames: id
            constraintName: fk_booking_event
            
        - addForeignKeyConstraint:
            baseTableName: booking
            baseColumnNames: seat_category_id
            referencedTableName: seat_categories
            referencedColumnNames: id
            constraintName: fk_booking_seat_category