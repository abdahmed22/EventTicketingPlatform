databaseChangeLog:

  - changeSet:
      id: create-seat-categories-table
      author: mazen
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: seat_categories
      changes:

        - createTable:
            tableName: seat_categories
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_seat_category_event
                    references: events(id)

              - column:
                  name: venue_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_seat_category_venue
                    references: venues(id)

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: total_seats
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: available_seats
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: seating_capacity
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false





