databaseChangeLog:
  - changeSet:
      id: 008-create-ticket-attendee-table
      author: event-ticketing
      comment: Create ticket_attendee table for EventTicketing.model.TicketAttendee entity
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: ticket_attendee
      changes:
        - createTable:
            tableName: ticket_attendee
            remarks: Links tickets to customers/attendees
            columns:
              - column:
                  name: uuid
                  type: UUID
                  autoIncrement: false
                  remarks: PK
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_ticket_attendee
                    nullable: false

              - column:
                  name: ticket_id
                  type: UUID
                  remarks: FK to tickets.uuid
                  constraints:
                    nullable: false

              - column:
                  name: customer_id
                  type: UUID
                  remarks: FK to users.id
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: ticket_attendee
            baseColumnNames: ticket_id
            constraintName: fk_ticket_attendee_ticket_id
            referencedTableName: tickets
            referencedColumnNames: uuid
            onDelete: CASCADE
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableName: ticket_attendee
            baseColumnNames: customer_id
            constraintName: fk_ticket_attendee_customer_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE

        - createIndex:
            tableName: ticket_attendee
            indexName: idx_ticket_attendee_ticket_id
            columns:
              - column:
                  name: ticket_id

        - createIndex:
            tableName: ticket_attendee
            indexName: idx_ticket_attendee_customer_id
            columns:
              - column:
                  name: customer_id

      rollback:
        - dropTable:
            tableName: ticket_attendee
